[package]
name = "swc-plugin-ignore-import"
version = "0.3.0"
edition = "2021"
description = "SWC plugin to ignore and remove certain imports based on configuration"
license = "MIT"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
homepage = "https://github.com/paazmaya/swc-plugin-ignore-import"
repository = "https://github.com/paazmaya/swc-plugin-ignore-import"
keywords = ["swc", "plugin", "swc-plugin", "import", "wasm"]
categories = ["development-tools", "wasm"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
crate-type = ["cdylib"]

[profile.release]
# This removes more dead code
codegen-units = 1
lto = true
# Optimize for size
opt-level = "s"
# Optimize for performance, this is default so you don't need to specify it
# opt-level = "z"
 
# Strip debug symbols
strip = "symbols"

[dependencies]
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"

# https://plugins.swc.rs/versions/range/138
swc_core = { version = "77.0.0", features = ["ecma_plugin_transform"] }

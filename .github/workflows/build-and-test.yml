name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust tools
      run: |
        rustup default stable
        rustup target add wasm32-wasip1

    # https://github.com/cargo-bins/cargo-binstall
    - name: Install binary installation tool for cargo
      uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

    # https://github.com/xd009642/tarpaulin
    - name: Install code coverage tool
      run: cargo binstall cargo-tarpaulin
      # Install takes a bit over 4 mins, while binstall 12 seconds

    - name: Build
      run: cargo build-wasi
    
    - name: Use Node.js v24
      uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
      with:
        node-version: '24.x'
    
    - name: Install npm dependencies
      run: npm install --ignore-scripts

    - name: SPDX Dependency Submission Action
      uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
  
    - name: Test usage with npm
      run: npm test

    - name: Install test result converter
      run: cargo binstall cargo2junit

    - name: Test internals with cargo
      run: |
        RUSTC_BOOTSTRAP=1 cargo test -- -Z unstable-options --format json --report-time | cargo2junit > junit.xml
        cargo tarpaulin --skip-clean --out xml

    - name: Upload coverage to Codecov
      uses: chainguard-actions/codecov-codecov-action@4e95a2ab133962d45d778e4ce39d1e21e4e536de # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        files: ./target/tarpaulin/coverage.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: chainguard-actions/codecov-test-results-action@c994e899f671b558b62900d077aacf26dd7bea38 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
